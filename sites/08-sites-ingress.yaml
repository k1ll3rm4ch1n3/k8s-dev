apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site1-ing
  namespace: site1
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  tls:
    - hosts:
        - site1.celmediafidelizacion.cl
      secretName: tls-site1
  rules:
    - host: site1.celmediafidelizacion.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-site1
                port:
                  number: 80
