apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-sync
  namespace: certs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-sync
  template:
    metadata:
      labels:
        app: cert-sync
    spec:
      serviceAccountName: cert-sync-sa
      containers:
        - name: cert-sync
          image: bitnami/kubectl:latest   # Imagen estable con kubectl ya incluido
          command: ["/bin/sh","-c"]
          args:
            - |
              apk add --no-cache bash inotify-tools openssl ca-certificates
              cat >/usr/local/bin/sync-certs.sh <<'EOF'
              #!/usr/bin/env bash
              set -euo pipefail
              NFS_DIR="${NFS_DIR:-/mnt/nfs/00Comun/00Certs}"
              TARGET_NS="${TARGET_NS:-certs}"
              normalize_secret_name(){ local n="${1//./}"; echo "secret_${n}"; }
              compute_pair_hash(){ sha256sum "$1" "$2" | awk '{print $1}' | sha256sum | awk '{print $1}'; }
              validate_crt_key(){ local crt="$1" key="$2"; 
                openssl x509 -noout -modulus -in "$crt" | openssl sha256 | awk '{print $2}' | \
                grep -q "$(openssl rsa -noout -modulus -in "$key" | openssl sha256 | awk '{print $2}')"; }
              sync_domain(){
                local d="$1"
                local crt="$NFS_DIR/$d.crt"
                local key="$NFS_DIR/$d.key"
                if [[ -f "$crt" && -f "$key" ]] && validate_crt_key "$crt" "$key"; then
                  h="$(compute_pair_hash "$crt" "$key")"
                  s="$(normalize_secret_name "$d")"
                  if kubectl -n "$TARGET_NS" get secret "$s" >/dev/null 2>&1; then
                    prev="$(kubectl -n "$TARGET_NS" get secret "$s" -o jsonpath='{.metadata.annotations.sync-hash}' 2>/dev/null || true)"
                    if [[ "$prev" == "$h" && -n "$prev" ]]; then
                      echo "[SKIP] $d sin cambios"
                      return 0
                    fi
                  fi
                  kubectl -n "$TARGET_NS" create secret tls "$s" --cert="$crt" --key="$key" --dry-run=client -o yaml | kubectl apply -f -
                  kubectl -n "$TARGET_NS" annotate secret "$s" sync-hash="$h" --overwrite
                  echo "[UPSERT] $d -> $s"
                else
                  echo "[WARN] $d: faltan crt/key válidos"
                fi
              }
              # Monitorear cambios en el directorio con inotify
              inotifywait -m -e close_write,create,delete "$NFS_DIR" --format '%f' | while read file; do
                domain="$(echo "$file" | sed -E 's/\.(crt|cer|pem|key)$//')"
                sync_domain "$domain"
              done
              EOF
              chmod +x /usr/local/bin/sync-certs.sh
              export NFS_DIR="/mnt/nfs/00Comun/00Certs"
              export TARGET_NS="certs"
              /usr/local/bin/sync-certs.sh
          volumeMounts:
            - name: nfs-certs
              mountPath: /mnt/nfs
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: nfs-certs
          persistentVolumeClaim:
            claimName: pvc-nfs-certs
