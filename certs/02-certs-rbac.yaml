apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-sync-sa
  namespace: certs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-sync-role
  namespace: certs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-sync-rb
  namespace: certs
subjects:
  - kind: ServiceAccount
    name: cert-sync-sa
    namespace: certs
roleRef:
  kind: Role
  name: cert-sync-role

  apiGroup: rbac.authorization.k8s.io
