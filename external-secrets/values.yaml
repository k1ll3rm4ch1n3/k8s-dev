# values.yaml para External Secrets Operator
# Chart: external-secrets/external-secrets
# Versión: v1.2.0

namespace: external-secrets

replicaCount: 2   # Alta disponibilidad

image:
  repository: ghcr.io/external-secrets/external-secrets
  tag: v1.2.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: external-secrets

rbac:
  create: true

webhook:
  create: true
  replicaCount: 2
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: v1.2.0
    pullPolicy: IfNotPresent
  port: 10250
  service:
    port: 443
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

certController:
  create: true
  replicaCount: 1
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: v1.2.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

controller:
  create: true
  replicaCount: 2
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: v1.2.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

metrics:
  enabled: true
  serviceMonitor:
    enabled: true   # Actívalo si usas Prometheus Operator

logLevel: info
